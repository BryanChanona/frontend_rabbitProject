<div class="book-form">
  <h2>Register a Book</h2>
  <form (ngSubmit)="savBook()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" [(ngModel)]="book.title" name="title" required />
    </div>
    <div class="form-group">
      <label for="author">Author:</label>
      <input type="text" id="author" [(ngModel)]="book.author" name="author" required />
    </div>
    <button type="submit" [disabled]="!book.title || !book.author">Save</button>
  </form> 
</div>
